<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Cyber ambient background aura -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff007f" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#00f3ff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>

    <!-- Metallic cyber heart gradient -->
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a85" />
      <stop offset="45%" stop-color="#ff0055" />
      <stop offset="100%" stop-color="#7928ca" />
    </linearGradient>

    <!-- Cyber pulse line gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f3ff" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#00f3ff" />
    </linearGradient>

    <!-- Neon Glow filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="pulseGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGlow)" />

  <!-- Robot Heart Base Chassis -->
  <path d="M32 56 C14 42 6 28 6 18 C6 10 12 4 20 4 C25.5 4 29.5 7.2 32 11.5 C34.5 7.2 38.5 4 44 4 C52 4 58 10 58 18 C58 28 50 42 32 56 Z"
        fill="url(#heartGrad)"
        stroke="#ff007f"
        stroke-width="1.5"
        stroke-linejoin="round"
        filter="url(#neonGlow)" />

  <!-- Left Cyber Panel Highlight -->
  <path d="M12 18 C12 13 16 9 21 9 C25 9 28 11.5 30 15 L26 26 L14 24 Z"
        fill="#ffffff"
        fill-opacity="0.25" />

  <!-- Right Cyber Panel Accent -->
  <path d="M52 18 C52 13 48 9 43 9 C39 9 36 11.5 34 15 L38 26 L50 24 Z"
        fill="#ffffff"
        fill-opacity="0.12" />

  <!-- Central Seam -->
  <path d="M32 14 L32 52" stroke="#1a0033" stroke-width="1.2" stroke-linecap="round" opacity="0.5" />

  <!-- Cyber Electrocardiogram / Core Pulse Line (ECG) -->
  <path d="M12 32 L22 32 L26 21 L30 41 L35 25 L39 35 L43 32 L52 32"
        fill="none"
        stroke="url(#cyanGrad)"
        stroke-width="2.2"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#pulseGlow)" />

  <!-- Core Reactor & Nodes -->
  <circle cx="12" cy="32" r="1.6" fill="#00f3ff" />
  <circle cx="52" cy="32" r="1.6" fill="#00f3ff" />
  <circle cx="26" cy="21" r="1.2" fill="#ffffff" />
  <circle cx="30" cy="41" r="1.2" fill="#ffffff" />
  <circle cx="35" cy="25" r="1.2" fill="#ffffff" />
  <circle cx="32" cy="32" r="2.8" fill="#ffffff" filter="url(#pulseGlow)" />
  <circle cx="32" cy="32" r="1.4" fill="#00f3ff" />

  <!-- Cyan Tech Rivets -->
  <circle cx="20" cy="8" r="1" fill="#00f3ff" opacity="0.9" />
  <circle cx="44" cy="8" r="1" fill="#00f3ff" opacity="0.9" />
  <circle cx="32" cy="52" r="1.2" fill="#00f3ff" opacity="0.9" />
</svg>
